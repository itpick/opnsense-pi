name: release

# Push a tag like 26.7-2 to build both images and publish them as a release.
# The Pages download buttons point at releases/latest, so they follow along.
# A tag whose release already exists (e.g. one made locally with `make release`)
# is left alone.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for an existing release
        id: existing
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'
      - name: Install tools
        if: steps.existing.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y qemu-utils mtools xz-utils unzip fdisk
      - name: Build images
        if: steps.existing.outputs.skip != 'true'
        run: make images
      - name: Publish release
        if: steps.existing.outputs.skip != 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.img.xz out/*.sha256 \
            --title "OPNsense Pi $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      - name: Keep images (manual runs)
        if: steps.existing.outputs.skip != 'true' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/
          retention-days: 7
