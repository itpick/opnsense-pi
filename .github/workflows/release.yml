name: release

# Push a tag like 26.7-2 to build both images and publish them as a release.
# The Pages download buttons point at releases/latest, so they follow along.
on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y qemu-utils mtools xz-utils unzip fdisk
      - name: Build images
        run: make images
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.img.xz out/*.sha256 \
            --title "OPNsense Pi $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
      - name: Keep images (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: out/
          retention-days: 7
